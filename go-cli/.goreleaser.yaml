version: 2
project_name: viralview-pp-cli
changelog:
  disable: true
builds:
  - id: viralview-pp-cli
    main: ./cmd/viralview-pp-cli
    binary: viralview-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X viralview-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: viralview-pp-mcp
    main: ./cmd/viralview-pp-mcp
    binary: viralview-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: viralview-pp-cli
    repository:
      owner: jonmac909
      name: homebrew-tap
    homepage: "https://github.com/jonmac909/viralview-pp-cli"
    description: "Safe local CLI and MCP for the Viral View public API"
    install: |
      bin.install "viralview-pp-cli"
      bin.install "viralview-pp-mcp"
