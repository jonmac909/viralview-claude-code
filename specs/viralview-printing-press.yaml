name: viralview
description: "Viral View V6 workflow MCP and local CLI with per-batch paid approval"
version: "0.1.0"
base_url: "https://app.viralview.io"
health_check_path: "/api/ugc/kie-status"

auth:
  type: bearer_token
  header: Authorization
  format: "Bearer {token}"
  env_vars:
    - VIRALVIEW_API_KEY

config:
  format: toml
  path: "~/.config/viralview-pp-cli/config.toml"

# Paid V6 dispatches require a short-lived approvalToken from the project's
# quote route. The MCP quote tools are read-only; dispatch tools refuse locally
# without the token and send it only in X-ViralView-Approval. The app must also
# enforce the token against the exact quote payload before provider dispatch.
learn:
  disabled: true

resources:
  projects:
    description: "Inspect saved Viral View projects"
    endpoints:
      list:
        method: GET
        path: "/api/ugc/project"
        description: "List owned projects"
        example: "  viralview-pp-cli projects list --json"
        response:
          type: array
          item: Project
        response_path: projects
      get:
        method: GET
        path: "/api/ugc/project"
        description: "Load one owned project"
        example: "  viralview-pp-cli projects get --id PROJECT_ID --json"
        params:
          - name: id
            type: string
            required: true
            description: "Owned Viral View project ID"
        response:
          type: object
          item: APIResponse

  library:
    description: "Search approved Viral View source ads"
    endpoints:
      search:
        method: GET
        path: "/api/ugc/ad-library"
        description: "Search the approved Ad Library"
        example: "  viralview-pp-cli library search --query claymation --style animation --limit 12 --json"
        params:
          - name: query
            type: string
            description: "Words to match in the ad library"
          - name: style
            type: string
            description: "Optional visual style filter"
          - name: limit
            type: int
            default: 12
            description: "Maximum results, capped at 24"
          - name: cursor
            type: string
            description: "Cursor from a prior library search"
        response:
          type: array
          item: LibraryItem
        response_path: items
        pagination:
          type: cursor
          limit_param: limit
          cursor_param: cursor
          next_cursor_path: nextCursor
      get:
        method: GET
        path: "/api/ugc/ad-library/{id}"
        description: "Load one approved source ad"
        example: "  viralview-pp-cli library get AD_ID --json"
        params:
          - name: id
            type: string
            required: true
            positional: true
            description: "Approved ad-library item ID"
        response:
          type: object
          item: APIResponse

  account:
    description: "Inspect account health, balance, and usage"
    endpoints:
      balance:
        method: GET
        path: "/api/ugc/kie-balance"
        description: "Read available generation-provider credits"
        example: "  viralview-pp-cli account balance --json"
        response:
          type: object
          item: Balance
      status:
        method: GET
        path: "/api/ugc/kie-status"
        description: "Check generation-provider reachability"
        example: "  viralview-pp-cli account status --json"
        response:
          type: object
          item: ProviderStatus
      usage:
        method: GET
        path: "/api/ugc/usage"
        description: "List recent generation and export usage"
        example: "  viralview-pp-cli account usage --limit 25 --json"
        params:
          - name: limit
            type: int
            default: 25
            description: "Maximum usage events, capped at 100"
        response:
          type: array
          item: UsageEvent
        response_path: events

  task_status:
    description: "Poll existing Viral View jobs without submitting another job"
    endpoints:
      extraction_status:
        method: GET
        path: "/api/ugc/extract-video"
        description: "Poll an existing source-link extraction job"
        example: "  viralview-pp-cli task-status extraction-status --job-id JOB_ID --json"
        params:
          - name: jobId
            flag_name: job-id
            type: string
            required: true
            description: "Existing extraction job ID"
        response:
          type: object
          item: JobStatus
      image_status:
        method: GET
        path: "/api/ugc/generate-overlay"
        description: "Poll an existing paid image job without spending again"
        example: "  viralview-pp-cli task-status image-status --task-id TASK_ID --json"
        params:
          - name: taskId
            flag_name: task-id
            type: string
            required: true
            description: "Existing image task ID"
          - name: sourceImageUrl
            flag_name: source-image-url
            type: string
            description: "Optional source image URL used to recover task state"
        response:
          type: object
          item: JobStatus
      export_status:
        method: GET
        path: "/api/ugc/stitch-videos"
        description: "Poll an existing export job"
        example: "  viralview-pp-cli task-status export-status --job-id JOB_ID --json"
        params:
          - name: jobId
            flag_name: job-id
            type: string
            required: true
            description: "Existing export job ID"
        response:
          type: object
          item: JobStatus

  product:
    description: "Inspect a product page before creating or generating anything"
    endpoints:
      scan:
        method: POST
        path: "/api/ugc/scan-product"
        description: "Extract editable product facts from a public product URL"
        example: "  viralview-pp-cli product --url https://example.com --json"
        body:
          - name: productUrl
            flag_name: url
            type: string
            required: true
            description: "Public product page URL"
        response:
          type: object
          item: APIResponse

  v6:
    description: "Viral View V6 project lifecycle and quote-gated generation endpoints"
    endpoints:
      project_create:
        method: POST
        path: "/api/ugc/project"
        description: "Create or save a project using the app project snapshot contract"
      project_status:
        method: GET
        path: "/api/v3/project/{id}/context"
        description: "Load the computed project workflow context and next actions"
      source_matches:
        method: POST
        path: "/api/ugc/source-matches"
        description: "Rank Ad Library candidates from product facts and source-match context"
      source_select:
        method: POST
        path: "/api/v3/project/{id}/intent"
        description: "Select a library or supplied source with select_source or set_supplied_source intent"
      source_extract:
        method: POST
        path: "/api/ugc/extract-video"
        description: "Start extracting a linked source video before analysis"
      source_analysis:
        method: POST
        path: "/api/ugc/analyze-video"
        description: "Analyze source scenes, timing, claims, proof, hook, and transcript"
      source_analysis_save:
        method: POST
        path: "/api/v3/project/{id}/intent"
        description: "Persist supplied-source transcript and scene timing with save_supplied_source_enrichment intent"
      script_draft:
        method: POST
        path: "/api/ugc/rewrite-script"
        description: "Draft or rewrite dialogue from source analysis and target product facts"
      script_draft_save:
        method: POST
        path: "/api/v3/project/{id}/intent"
        description: "Persist script text and scenes with save_script_draft intent"
      script_edit_line:
        method: POST
        path: "/api/v3/project/{id}/intent"
        description: "Edit script dialogue with edit_script intent"
      script_approve:
        method: POST
        path: "/api/v3/project/{id}/intent"
        description: "Approve the saved script beat with approve intent"
      script_score:
        method: POST
        path: "/api/v3/project/{id}/script-score"
        description: "Score the saved project script"
      characters_quote:
        method: POST
        path: "/api/v3/project/{id}/quote"
        description: "Quote action characters before character-dispatch"
      characters_generate:
        method: POST
        path: "/api/v3/project/{id}/character-dispatch"
        description: "Paid character dispatch. Requires X-ViralView-Approval from the matching quote payload"
      character_lock:
        method: POST
        path: "/api/ugc/lock-character"
        description: "Save a reusable character identity lock"
      character_saved_list:
        method: GET
        path: "/api/v3/characters"
        description: "List saved character candidates"
      character_use_saved:
        method: POST
        path: "/api/v3/project/{id}/intent"
        description: "Reuse a saved character with reuse_saved_character intent"
      frames_quote:
        method: POST
        path: "/api/v3/project/{id}/quote"
        description: "Quote frames or frame_remake before image dispatch"
      frames_generate:
        method: POST
        path: "/api/v3/project/{id}/frames"
        description: "Paid V6 frame dispatch. Requires X-ViralView-Approval from the matching quote payload"
      frame_edit:
        method: POST
        path: "/api/v3/project/{id}/frames"
        description: "Prepare a scene frame prompt without dispatching image generation"
      videos_quote:
        method: POST
        path: "/api/v3/project/{id}/quote"
        description: "Quote scene_videos, scene_regenerate, or lip_redo before video dispatch"
      videos_generate:
        method: POST
        path: "/api/v3/project/{id}/generate"
        description: "Paid V6 video dispatch. Requires X-ViralView-Approval from the matching quote payload"
      auto_quote:
        method: POST
        path: "/api/v3/project/{id}/quote"
        description: "Quote the persisted V6 auto plan; pass the same stable requestId and workspacePath to auto_start"
      auto_start:
        method: POST
        path: "/api/v3/project/{id}/auto/start"
        description: "Start paid V6 auto processing after quote approval"
      auto_stop:
        method: POST
        path: "/api/v3/project/{id}/auto/stop"
        description: "Stop an active V6 auto run"
      intent_retry_quote:
        method: POST
        path: "/api/v3/project/{id}/quote"
        description: "Quote a persisted paid character, frame, video, or export retry before retry intent"
      intent_retry:
        method: POST
        path: "/api/v3/project/{id}/intent"
        description: "Paid persisted retry intent. Requires X-ViralView-Approval from matching quote"
      product_cutout_quote:
        method: POST
        path: "/api/v3/project/{id}/quote"
        description: "Quote removal of a selected product image background"
      product_cutout:
        method: POST
        path: "/api/v3/project/{id}/product-cutout"
        description: "Paid product image background removal. Requires X-ViralView-Approval"
      product_cutout_status:
        method: POST
        path: "/api/v3/project/{id}/product-cutout"
        description: "Poll the selected product image background removal job"
      ad_score:
        method: POST
        path: "/api/v3/project/{id}/ad-score"
        description: "Score a completed project video"
      editor_update:
        method: POST
        path: "/api/ugc/project"
        description: "Save the current V6 app project snapshot with editor state, trims, selected scenes, and caption style"
      export_quote:
        method: POST
        path: "/api/v3/project/{id}/quote"
        description: "Quote action export before final rendering"
      export_start:
        method: POST
        path: "/api/ugc/stitch-videos"
        description: "Paid final export. Requires X-ViralView-Approval from the matching quote payload"
      export_status:
        method: GET
        path: "/api/v3/project/{id}/export-status"
        description: "Poll the saved export job for an owned project"
      export_download:
        method: GET
        path: "/api/uploads/{key}"
        description: "Download the caller's own exported video via the developer API upload route"
      meta_ad_library_search:
        method: GET
        path: "/api/ugc/meta-ad-library/search"
        description: "Search the Meta Ad Library"
      caption_redo:
        method: POST
        path: "/api/ugc/redo-captions"
        description: "Run the existing caption redo operation"

types:
  APIResponse:
    fields:
      - name: success
        type: bool
  Project:
    fields:
      - name: id
        type: string
      - name: name
        type: string
      - name: step
        type: int
  LibraryItem:
    fields:
      - name: id
        type: string
      - name: title
        type: string
      - name: source
        type: string
      - name: style
        type: string
      - name: durationSec
        type: float
  Balance:
    fields:
      - name: credits
        type: float
      - name: usd
        type: float
      - name: checkedAt
        type: string
  ProviderStatus:
    fields:
      - name: status
        type: string
      - name: checkedAt
        type: string
      - name: message
        type: string
  UsageEvent:
    fields:
      - name: timestamp
        type: string
      - name: kind
        type: string
      - name: model
        type: string
      - name: sceneCount
        type: int
  JobStatus:
    fields:
      - name: status
        type: string
      - name: progress
        type: float
      - name: taskId
        type: string
      - name: jobId
        type: string
